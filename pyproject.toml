[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-kurz-lekce1"
version = "1.0.0"
description = "Kompletní sada automatizovaných E2E testů pro testovani.kitner.cz"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "pytest>=8.0.0",
    "pytest-playwright>=0.4.0",
    "pytest-html>=4.0.0",
    "pytest-base-url>=2.0.0",
    "requests>=2.31.0",
    "python-slugify>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --browser chromium --html=reports/report.html --self-contained-html --css=reports/report_style.css -rA"
markers = [
    "smoke: klíčové smoke testy",
    "auth: testy autentizace a správy účtu",
    "courses: testy kurzů a přihlašování",
    "profile: testy profilu uživatele"
]
